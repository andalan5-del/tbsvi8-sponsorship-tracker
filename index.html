<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TBSVI8 Sponsorship Tracker V1</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--nav:#172235;--blue:#2563eb;--bg:#f5f7fb;--card:#fff;--text:#182338;--muted:#718096;--line:#e6eaf0}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
.app{display:flex;min-height:100vh}.side{width:220px;background:var(--nav);color:#fff;padding:22px 14px;position:fixed;inset:0 auto 0 0}.brand{font-weight:800;letter-spacing:1px;font-size:15px;padding:4px 12px 28px}.brand span{display:block;font-size:10px;letter-spacing:2px;opacity:.65;margin-top:4px}
.nav button{width:100%;background:none;border:0;color:#d9e0ea;text-align:left;padding:13px 14px;border-radius:9px;margin:3px 0;font-size:14px;cursor:pointer}.nav button.active,.nav button:hover{background:#2457a7;color:#fff}.user{position:absolute;bottom:20px;left:18px;right:18px;font-size:12px;color:#d9e0ea}
.main{margin-left:220px;width:calc(100% - 220px);padding:28px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.title h1{margin:0;font-size:24px}.title p{margin:5px 0;color:var(--muted)}
.page{display:none}.page.active{display:block}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:0 2px 8px #00000008;margin-bottom:18px}.metric .label{font-size:13px;color:var(--muted)}.metric .value{font-size:24px;font-weight:800;margin-top:8px}
button{border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:var(--blue);color:#fff}.secondary{background:#eef2f7;color:#27364d}.danger{background:#b42318;color:#fff}
.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}input,textarea{width:100%;padding:10px 11px;border:1px solid #ccd3df;border-radius:8px;font:inherit}textarea{min-height:80px}
table{width:100%;border-collapse:collapse}th,td{padding:11px 9px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}th{background:#f8fafc}.muted{color:var(--muted)}
.search{display:flex;gap:10px}.search input{flex:1}.notice{padding:11px 13px;border-radius:8px;background:#fff4e5;margin:10px 0}.ok{background:#ecfdf3}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.login .box{width:420px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px}.login h1{margin:0 0 6px}.hidden{display:none!important}
@media(max-width:800px){.side{width:180px}.main{margin-left:180px;width:calc(100% - 180px)}.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.side{position:static;width:100%;min-height:auto}.app{display:block}.main{margin:0;width:100%;padding:18px}.grid,.formgrid{grid-template-columns:1fr}.user{position:static;margin-top:20px}.search{flex-direction:column}}
</style>
</head>
<body>

<div id="loginView" class="login">
  <div class="box">
    <h1>TBSVI8 Sponsorship Tracker V1</h1>
    <p class="muted">Login dengan username dan password.</p>
    <div id="loginMsg"></div>
    <label>Username</label>
    <input id="username" autocomplete="username" placeholder="Username">
    <br><br>
    <label>Password</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="Password">
    <br><br>
    <button class="primary" style="width:100%" onclick="login()">Login</button>
  </div>
</div>

<div id="appView" class="app hidden">
  <aside class="side">
    <div class="brand">TBSVI8<span>SPONSORSHIP TRACKER V1</span></div>
    <div class="nav">
      <button class="active" onclick="page('dashboard',this)">Dashboard</button>
      <button onclick="page('nasabah',this)">Nasabah</button>
      <button onclick="page('input',this)">Input Sponsorship</button>
      <button onclick="page('report',this)">Report</button>
    </div>
    <div class="user" id="userInfo"></div>
  </aside>
  <main class="main">
    <div class="top"><div class="title"><h1 id="pageTitle">Dashboard</h1><p>Data sponsorship bersama</p></div><button class="secondary" onclick="logout()">Logout</button></div>

    <section id="dashboard" class="page active">
      <div class="grid">
        <div class="card metric"><div class="label">Total Nasabah</div><div class="value" id="totalNasabah">0</div></div>
        <div class="card metric"><div class="label">Total Sponsorship</div><div class="value" id="totalSponsorship">0</div></div>
        <div class="card metric"><div class="label">Total Nominal</div><div class="value" id="totalNominal">Rp 0</div></div>
        <div class="card metric"><div class="label">Bulan Ini</div><div class="value" id="bulanIni">Rp 0</div></div>
      </div>
      <div class="card"><h2>Nasabah dengan sponsorship terbesar</h2><div id="topList"></div></div>
    </section>

    <section id="nasabah" class="page">
      <div class="card"><h2>Cari Nasabah</h2><div class="search"><input id="searchNasabah" placeholder="Ketik nama nasabah..." oninput="searchNasabah()"><button class="primary" onclick="searchNasabah()">Cari</button></div></div>
      <div id="nasabahResults"></div><div id="nasabahDetail"></div>
    </section>

    <section id="input" class="page">
      <div class="card"><h2>Input Sponsorship</h2><div id="inputMsg"></div>
        <div class="formgrid">
          <div><label>Nasabah</label><input id="fNasabah" placeholder="Nama nasabah"></div>
          <div><label>Tanggal</label><input id="fTanggal" type="date"></div>
          <div><label>Kegiatan</label><input id="fKegiatan" placeholder="Nama kegiatan"></div>
          <div><label>Nominal</label><input id="fNominal" type="number" min="0" placeholder="0"></div>
          <div><label>PIC</label><input id="fPic" placeholder="Nama PIC"></div>
          <div><label>Catatan (opsional)</label><input id="fCatatan" placeholder="Catatan"></div>
        </div><br><button class="primary" onclick="saveData()">Simpan Sponsorship</button>
      </div>
    </section>

    <section id="report" class="page">
      <div class="card"><h2>Report</h2>
        <div class="formgrid">
          <div><label>Dari tanggal</label><input id="rFrom" type="date"></div>
          <div><label>Sampai tanggal</label><input id="rTo" type="date"></div>
          <div><label>Nasabah</label><input id="rNasabah" placeholder="Opsional"></div>
          <div><label>PIC</label><input id="rPic" placeholder="Opsional"></div>
        </div><br>
        <button class="primary" onclick="runReport()">Tampilkan</button>
        <button class="secondary" onclick="exportCSV()">Export CSV</button>
      </div>
      <div class="card"><div id="reportTable"></div></div>
    </section>
  </main>
</div>

<script>
const SUPABASE_URL="https://txmxctzuhckexbkgbchy.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_oyyBZwodIFqtT5mUcvegnA_i5tKrxxO";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let rows=[],profile=null,reportRows=[];

const rupiah=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));

async function login(){
  const u=document.getElementById('username').value.trim(),p=document.getElementById('password').value,msg=document.getElementById('loginMsg');
  msg.innerHTML='';
  if(!u||!p){msg.innerHTML='<div class="notice">Username dan password wajib diisi.</div>';return}
  const {data,emailError}=await getEmail(u);
  if(emailError||!data){msg.innerHTML='<div class="notice">Username tidak ditemukan.</div>';return}
  const {error}=await db.auth.signInWithPassword({email:data,password:p});
  if(error){msg.innerHTML='<div class="notice">Login gagal. Cek username/password.</div>';return}
  await start();
}
async function getEmail(username){
  const res=await db.rpc('get_login_email',{p_username:username});
  return {data:res.data,error:res.error};
}
async function start(){
  const {data:{user}}=await db.auth.getUser();if(!user)return;
  const p=await db.from('profiles').select('*').eq('id',user.id).single();
  profile=p.data||{nama:user.email,username:user.email};
  document.getElementById('userInfo').textContent=profile.nama+' (@'+profile.username+')';
  document.getElementById('loginView').classList.add('hidden');document.getElementById('appView').classList.remove('hidden');
  document.getElementById('fTanggal').value=new Date().toISOString().slice(0,10);
  await load();
}
async function logout(){await db.auth.signOut();location.reload()}
async function load(){
  const res=await db.from('sponsorship').select('id,nasabah_id,tanggal,kegiatan,nominal,pic,catatan,input_by,nasabah(nama)').order('tanggal',{ascending:false});
  if(res.error){alert(res.error.message);return}
  rows=res.data||[];
  const names=new Set(rows.map(r=>r.nasabah?.nama).filter(Boolean));
  document.getElementById('totalNasabah').textContent=names.size;
  document.getElementById('totalSponsorship').textContent=rows.length;
  document.getElementById('totalNominal').textContent=rupiah(rows.reduce((a,r)=>a+Number(r.nominal||0),0));
  const ym=new Date().toISOString().slice(0,7);
  document.getElementById('bulanIni').textContent=rupiah(rows.filter(r=>String(r.tanggal).slice(0,7)===ym).reduce((a,r)=>a+Number(r.nominal||0),0));
  const sums={};rows.forEach(r=>{const n=r.nasabah?.nama||'';sums[n]=(sums[n]||0)+Number(r.nominal||0)});
  const top=Object.entries(sums).sort((a,b)=>b[1]-a[1]).slice(0,10);
  document.getElementById('topList').innerHTML=top.length?'<table><tr><th>Nasabah</th><th>Total</th></tr>'+top.map(x=>'<tr><td>'+esc(x[0])+'</td><td>'+rupiah(x[1])+'</td></tr>').join('')+'</table>':'<p class="muted">Belum ada data.</p>';
}
function page(id,btn){
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');
  document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');
  document.getElementById('pageTitle').textContent=btn.textContent;
}
function searchNasabah(){
  const q=document.getElementById('searchNasabah').value.trim().toLowerCase();
  const names=[...new Set(rows.map(r=>r.nasabah?.nama).filter(Boolean))].filter(n=>n.toLowerCase().includes(q)).slice(0,30);
  document.getElementById('nasabahResults').innerHTML=names.length?'<div class="card">'+names.map(n=>'<button class="secondary" style="margin:4px" onclick=\'detailNasabah('+JSON.stringify(n)+')\'>'+esc(n)+'</button>').join('')+'</div>':'';
}
function detailNasabah(name){
  const rs=rows.filter(r=>r.nasabah?.nama===name),total=rs.reduce((a,r)=>a+Number(r.nominal||0),0);
  document.getElementById('nasabahDetail').innerHTML='<div class="card"><h2>'+esc(name)+'</h2><p><b>Total sponsorship:</b> '+rupiah(total)+' &nbsp; <b>Jumlah:</b> '+rs.length+'</p><table><tr><th>Tanggal</th><th>Kegiatan</th><th>Nominal</th><th>PIC</th><th>Catatan</th></tr>'+rs.map(r=>'<tr><td>'+esc(r.tanggal)+'</td><td>'+esc(r.kegiatan)+'</td><td>'+rupiah(r.nominal)+'</td><td>'+esc(r.pic)+'</td><td>'+esc(r.catatan)+'</td></tr>').join('')+'</table></div>';
}
async function saveData(){
  const msg=document.getElementById('inputMsg');msg.innerHTML='';
  const name=f('fNasabah'),tanggal=f('fTanggal'),kegiatan=f('fKegiatan'),nominal=Number(f('fNominal')),pic=f('fPic'),catatan=f('fCatatan');
  if(!name||!tanggal||!kegiatan||!pic||Number.isNaN(nominal)){msg.innerHTML='<div class="notice">Lengkapi Nasabah, Tanggal, Kegiatan, Nominal, dan PIC.</div>';return}
  let n=(await db.from('nasabah').select('id').eq('nama',name).maybeSingle()).data;
  if(!n){const ins=await db.from('nasabah').insert({nama:name}).select('id').single();if(ins.error){msg.innerHTML='<div class="notice">'+esc(ins.error.message)+'</div>';return}n=ins.data}
  const {data:{user}}=await db.auth.getUser();
  const ins=await db.from('sponsorship').insert({nasabah_id:n.id,tanggal,kegiatan,nominal,pic,catatan:catatan||null,input_by:user.id});
  if(ins.error){msg.innerHTML='<div class="notice">'+esc(ins.error.message)+'</div>';return}
  msg.innerHTML='<div class="notice ok">Sponsorship berhasil disimpan.</div>';
  ['fNasabah','fKegiatan','fNominal','fPic','fCatatan'].forEach(id=>document.getElementById(id).value='');await load();
}
function f(id){return document.getElementById(id).value.trim()}
function filtered(){
  const from=f('rFrom'),to=f('rTo'),n=f('rNasabah').toLowerCase(),p=f('rPic').toLowerCase();
  return rows.filter(r=>(!from||r.tanggal>=from)&&(!to||r.tanggal<=to)&&(!n||(r.nasabah?.nama||'').toLowerCase().includes(n))&&(!p||(r.pic||'').toLowerCase().includes(p)));
}
function runReport(){
  reportRows=filtered();document.getElementById('reportTable').innerHTML=reportRows.length?'<table><tr><th>Tanggal</th><th>Nasabah</th><th>Kegiatan</th><th>Nominal</th><th>PIC</th><th>Catatan</th></tr>'+reportRows.map(r=>'<tr><td>'+esc(r.tanggal)+'</td><td>'+esc(r.nasabah?.nama)+'</td><td>'+esc(r.kegiatan)+'</td><td>'+rupiah(r.nominal)+'</td><td>'+esc(r.pic)+'</td><td>'+esc(r.catatan)+'</td></tr>').join('')+'</table>':'<p class="muted">Tidak ada data.</p>';
}
function exportCSV(){
  reportRows=filtered();if(!reportRows.length){alert('Tidak ada data untuk diexport.');return}
  const h=['Tanggal','Nasabah','Kegiatan','Nominal','PIC','Catatan','Input By'];
  const data=reportRows.map(r=>[r.tanggal,r.nasabah?.nama,r.kegiatan,r.nominal,r.pic,r.catatan||'',profile?.username||'']);
  const csv=[h,...data].map(a=>a.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='sponsorship-report.csv';a.click();
}
(async()=>{const {data:{session}}=await db.auth.getSession();if(session)await start()})();
</script>
</body>
</html>
